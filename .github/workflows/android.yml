name: Build BirrWise APK

'on':
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK components
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Check project archive
    run: test -f BirrWise-Android-Starter.zip

  - name: Extract project
    run: unzip -q BirrWise-Android-Starter.zip -d extracted

  - name: Locate project
    run: |
      SETTINGS=$(find extracted -name settings.gradle.kts -print -quit)
      test -n "$SETTINGS"
      echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

  - name: Build APK
    run: gradle -p "$PROJECT_DIR" assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: BirrWise-debug-APK
      path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
