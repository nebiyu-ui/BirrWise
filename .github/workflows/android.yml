name: Build BirrWise APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract starter project
        run: |
          test -f BirrWise-Android-Starter.zip
          unzip -q BirrWise-Android-Starter.zip -d extracted

      - name: Locate project
        run: |
          SETTINGS=$(find extracted -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Align Java target with Kotlin (temporary patch)
        run: |
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          {
            echo ''
            echo 'android {'
            echo '    compileOptions {'
            echo '        sourceCompatibility = JavaVersion.VERSION_17'
            echo '        targetCompatibility = JavaVersion.VERSION_17'
            echo '    }'
            echo '}'
          } >> "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BirrWise-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
