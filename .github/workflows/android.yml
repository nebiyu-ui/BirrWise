name: Build BirrWise APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check uploaded project
    run: |
      ls -la
      find . -maxdepth 3 -type f

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK components
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Verify project archive
    run: |
      test -f BirrWise-Android-Starter.zip
      unzip -l BirrWise-Android-Starter.zip

  - name: Extract project
    run: unzip -q BirrWise-Android-Starter.zip -d extracted

  - name: Locate Gradle project
    run: find extracted -name settings.gradle.kts -o -name build.gradle.kts

  - name: Build APK
    run: |
      PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
      test -n "$PROJECT_DIR"
      gradle -p "$PROJECT_DIR" assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: BirrWise-debug-APK
      path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
