name: Build BirrWise APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply update.zip if present
        if: github.event_name != 'pull_request'
        run: |
          if [ -f update.zip ]; then
            unzip -o -q update.zip
            rm update.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply update.zip"
            git push
          fi

      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_PASSPHRASE: ${{ secrets.DEBUG_KEYSTORE_PASSPHRASE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_PASSPHRASE" ] && [ -f app/debug.keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
              -pass env:DEBUG_KEYSTORE_PASSPHRASE \
              -in app/debug.keystore.enc -out "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Using the fixed debug signing key."
          else
            echo "No fixed debug key available. Using the default debug key."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Show signing certificate fingerprint
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | grep "SHA-256" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BirrWise-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
