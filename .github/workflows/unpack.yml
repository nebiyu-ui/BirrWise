name: Unpack starter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Stop if already unpacked
        run: |
          if [ -e app/build.gradle.kts ]; then
            echo "Project already unpacked. Nothing to do."
            exit 1
          fi
          test -f BirrWise-Android-Starter.zip

      - name: Unpack starter into repo root
        run: |
          unzip -q BirrWise-Android-Starter.zip -d /tmp/starter
          SETTINGS=$(find /tmp/starter -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          rm -f "$PROJECT_DIR/README.md"
          cp -r "$PROJECT_DIR"/. .

      - name: Make the Java 17 setting permanent
        run: |
          {
            echo ''
            echo 'android {'
            echo '    compileOptions {'
            echo '        sourceCompatibility = JavaVersion.VERSION_17'
            echo '        targetCompatibility = JavaVersion.VERSION_17'
            echo '    }'
            echo '}'
          } >> app/build.gradle.kts

      - name: Generate Gradle wrapper
        run: |
          mkdir /tmp/wrapper
          cd /tmp/wrapper
          touch settings.gradle
          gradle wrapper --gradle-version 8.10.2
          cd "$GITHUB_WORKSPACE"
          cp -r /tmp/wrapper/gradle .
          cp /tmp/wrapper/gradlew /tmp/wrapper/gradlew.bat .

      - name: Add .gitignore
        run: |
          if [ ! -e .gitignore ]; then
            printf '%s\n' '.gradle/' 'build/' 'local.properties' '.idea/' '*.iml' 'captures/' > .gitignore
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack starter project into repo root"
          git push
